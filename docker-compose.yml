# ── Hovod development stack ─────────────────────────────────────────────────
# DEVELOPMENT ONLY. Runs the infrastructure (MySQL, Redis, RustFS) as separate
# containers plus the Hovod image split into an API and a worker container
# (HOVOD_ROLE). Infrastructure ports are bound to 127.0.0.1 only.
#
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost:3002        (dashboard + API on the same port)
#
# For production use the single all-in-one image (see DOCKER.md) or
# docker-compose.prod.yml.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: hovod
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --loglevel warning --save 60 1
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage. RustFS replaces MinIO, whose images left Docker Hub.
  # Its root credentials are the S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY the
  # API and worker use, so .env holds a single pair.
  rustfs:
    image: rustfs/rustfs:1.0.7
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket and grants anonymous read on playback/ and settings/
  # ONLY: private/ (signed playback) and sources/ (original uploads) stay private.
  rustfs-init:
    image: amazon/aws-cli:2.42.4
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-hovod-vod}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://rustfs:9000 s3api"
        $$s3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$s3 create-bucket --bucket "$$BUCKET"
        $$s3 put-bucket-policy --bucket "$$BUCKET" --policy "{
          \"Version\": \"2012-10-17\",
          \"Statement\": [{
            \"Sid\": \"PublicPlayback\",
            \"Effect\": \"Allow\",
            \"Principal\": {\"AWS\": [\"*\"]},
            \"Action\": [\"s3:GetObject\"],
            \"Resource\": [\"arn:aws:s3:::$$BUCKET/playback/*\", \"arn:aws:s3:::$$BUCKET/settings/*\"]
          }]
        }"
        echo "bucket $$BUCKET ready"

  api:
    build: .
    image: hovod:dev
    env_file: .env
    environment:
      HOVOD_ROLE: api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-3002}:3000"
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: .
    image: hovod:dev
    env_file: .env
    environment:
      HOVOD_ROLE: worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rustfs-data:
  uploads:
